name: Docs Check

# Validate the documentation build on every pull request that touches the docs.
# Does NOT deploy anything.

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest

    # All run steps execute inside the website/ folder, which holds mkdocs.yml
    # and the docs/ content.
    defaults:
      run:
        working-directory: website

    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: website/requirements.txt

    - name: Install dependencies
      run: pip install --require-hashes -r requirements.txt

    - name: Build documentation
      run: mkdocs build --strict
