name: Docs Snapshot

# Publish the "snapshot" docs version (current main) to GitHub Pages.
# Releases are published by docs-release.yml.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialize all deployments to the gh-pages branch to avoid push conflicts.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy snapshot
    runs-on: ubuntu-latest

    # All run steps execute inside the website/ folder, which holds mkdocs.yml
    # and the docs/ content.
    defaults:
      run:
        working-directory: website

    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: website/requirements.txt

    - name: Install dependencies
      run: pip install --require-hashes -r requirements.txt

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Deploy snapshot docs
      run: mike deploy --push snapshot
